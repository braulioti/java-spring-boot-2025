name: Continuous Integration and Delivery with Github Actions

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Wait for MySQL
      run: |
        echo "Waiting for MySQL to be healthy..."
        for i in {1..30}; do
          if mysqladmin ping -h 127.0.0.1 -u test -ptest &>/dev/null; then
            echo "MySQL is up!"
            break
          fi
          echo "Waiting 2s..."
          sleep 2
        done

    - name: Verify Docker
      run: |
        docker version
        docker info   

    - name: Build Application .jar
      working-directory: ./
      run: mvn clean package
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/testdb
        SPRING_DATASOURCE_USERNAME: test
        SPRING_DATASOURCE_PASSWORD: test

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Docker Compose Build
      working-directory: ./
      run: docker-compose build

    - name: Push to Dokcer Hub Container Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-2025:latest ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-2025:${{ github.run_id }}
        docker push ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-2025:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-2025:${{ github.run_id }}
