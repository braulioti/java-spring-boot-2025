cors:
  originPatterns: http://localhost:9000,http://localhost:3000,https://brau.io
spring:
  application:
    name: java-spring-boot-2025
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enabled: true
      mail.smtp.starttls.required: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
file:
  upload-dir: E:/projetos/pessoal/java-spring-boot-2025/uploads
security:
  jwt:
    token:
      secret-key: 53cr37
      expire-length: 3600000
email:
  subject: "Default Subject"
  message: "Default Message"
server:
  port: 8888
  tomcat:
    use-native: false
logging:
  level:
    br.com.braulioti: debug
    #root: warn
spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
