spring:
  application:
    name: java-spring-boot-2025
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/java_spring_boot_2025?useTimezone=true&serverTimezone=UTC
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
cors:
  originPatterns: http://localhost:9000,http://localhost:3000,https://brau.io
file:
  upload-dir: E:/projetos/pessoal/java-spring-boot-2025/uploads
server:
  port: 9000
  tomcat:
    use-native: false
logging:
  level:
    br.com.braulioti: debug
    #root: warn
spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
