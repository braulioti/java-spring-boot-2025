spring:
  application:
    name: java-spring-boot-2025
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
server:
  port: 8888
  tomcat:
    use-native: false
logging:
  level:
    br.com.braulioti: debug
    #root: warn
spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
