name: Continuous Integration and Delivery with Github Actions

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Verify Docker
      run: |
        docker version
        docker info

    - name: Fix Docker permissions
      run: |
        sudo systemctl start docker
        sudo chmod 666 /var/run/docker.sock
        docker info     

    - name: Build Application .jar
      working-directory: ./
      run: mvn clean package
      env:
        DOCKER_API_VERSION: 1.44
        TESTCONTAINERS_RYUK_DISABLED: true
        TESTCONTAINERS_HOST_OVERRIDE: localhost
        DOCKER_HOST: unix:///var/run/docker.sock

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Docker Compose Build
      working-directory: ./
      run: docker-compose build

    - name: Push to Dokcer Hub Container Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-2025:latest ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-2025:${{ github.run_id }}
        docker push ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-2025:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-2025:${{ github.run_id }}
