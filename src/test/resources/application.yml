cors:
  originPatterns: http://localhost:9000,http://localhost:3000,https://brau.io
spring:
  application:
    name: java-spring-boot-2025
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
file:
  upload-dir: E:/projetos/pessoal/java-spring-boot-2025/uploads
server:
  port: 8888
  tomcat:
    use-native: false
logging:
  level:
    br.com.braulioti: debug
    #root: warn
spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
